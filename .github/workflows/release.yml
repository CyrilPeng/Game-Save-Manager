name: Build Windows installer
run-name: Build Windows installer · ${{ inputs.ref || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支、tag 或 commit SHA，留空使用所选工作流分支
        required: false
        type: string
      publish:
        description: 构建成功后发布 Release；启用时 ref 必须是已有版本 tag
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: installer-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Verify build version and record source commit
        id: metadata
        shell: pwsh
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $version = $package.version
          if (-not $version -or $version -cne $lock.version -or $version -cne $lock.packages[''].version) {
            throw 'package.json and package-lock.json versions must match.'
          }
          $tag = "v$version"
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne $tag) {
            throw "Release tag $env:RELEASE_TAG does not match package version $version."
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^##[^\S\r\n]+' + [regex]::Escape($tag) + '[^\S\r\n]*\r?\n(?<body>.*?)(?=^##[^\S\r\n]+|\z)'
          $sections = [regex]::Matches($changelog, $pattern)
          if ($sections.Count -ne 1) {
            throw "CHANGELOG.md must include exactly one section for $tag."
          }
          $notes = $sections[0].Groups['body'].Value.Trim()
          if (-not $notes) { throw "CHANGELOG.md section for $tag is empty." }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the build commit.' }
          if ($env:PUBLISH -eq 'true') {
            $requestedTag = $env:BUILD_REF -replace '^refs/tags/', ''
            if ($requestedTag -cne $tag) { throw "Publishing requires ref $tag." }
            $tagCommit = git rev-parse "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $commit) {
              throw 'The build commit must match the release tag.'
            }
            $env:RELEASE_TAG = $tag
          }
          $prerelease = ($version.Split('+')[0] -match '-').ToString().ToLowerInvariant()
          "tag=$tag`ncommit=$commit`nprerelease=$prerelease" | Add-Content $env:GITHUB_OUTPUT
          $buildInfo = [ordered]@{
            version = $version
            commit = $commit
            ref = $env:BUILD_REF
            tag = $env:RELEASE_TAG
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          New-Item -ItemType Directory -Path test-output -Force | Out-Null
          $buildInfo | ConvertTo-Json | Set-Content test-output/build-info.json -Encoding utf8
          $notes | Set-Content test-output/release-notes.md -Encoding utf8
          "## Windows installer build`n`nVersion: $version`n`nCommit: $commit`n`nRequested ref: $env:BUILD_REF" | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:resources
      - run: npm test
      - run: npm run dist
      - run: npm run test:electron
      - run: npm run test:app
      - run: npm run test:packaged
      - name: Upload tested installer and database assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-save-manager-windows-x64
          if-no-files-found: error
          path: |
            dist/release/*Setup*.exe
            dist/release/*.blockmap
            resources/database/database.db
            resources/database/database-manifest.json
            test-output/build-info.json
            test-output/release-notes.md
  release:
    needs: installer
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.installer.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download tested installer and release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: game-save-manager-windows-x64
          path: outputs
      - name: Create draft Release and upload assets
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.installer.outputs.tag }}
          BUILD_COMMIT: ${{ needs.installer.outputs.commit }}
          PRERELEASE: ${{ needs.installer.outputs.prerelease }}
        run: |
          set -euo pipefail
          installer="outputs/dist/release/Game Save Manager Setup ${RELEASE_TAG#v}.exe"
          notes="outputs/test-output/release-notes.md"
          files=(
            "$installer"
            "$installer.blockmap"
            "outputs/resources/database/database.db"
            "outputs/resources/database/database-manifest.json"
          )
          for file in "$notes" "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty release file: $file"
              exit 1
            fi
          done
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tag_commit" != "$BUILD_COMMIT" ]]; then
            echo "::error::The release tag no longer matches the tested build."
            exit 1
          fi
          if existing_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$existing_draft" == "false" ]]; then
              echo "::notice::Release $RELEASE_TAG is already published."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes" --prerelease="$PRERELEASE"
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$notes" --draft)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" "${args[@]}"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish completed Release
        if: steps.draft.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.installer.outputs.tag }}
          PRERELEASE: ${{ needs.installer.outputs.prerelease }}
        run: |
          latest=true
          if [[ "$PRERELEASE" == "true" ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
