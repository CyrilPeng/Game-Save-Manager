name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:resources
      - run: npm test
      - run: npm run dist
      - run: npm run test:electron
      - run: npm run test:app
      - run: npm run test:packaged
      - name: Upload tested installer and database assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-save-manager-windows-x64
          if-no-files-found: error
          path: |
            dist/release/*Setup*.exe
            dist/release/*.blockmap
            resources/database/database.db
            resources/database/database-manifest.json
